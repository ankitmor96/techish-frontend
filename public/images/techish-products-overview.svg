    <text x="246" y="152" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="7" fill="#8b8fa3">"I've analyzed your sales</text>
    <text x="246" y="162" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="7" fill="#8b8fa3">data — 23% increase…"</text>
