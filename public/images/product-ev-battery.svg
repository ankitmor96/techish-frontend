<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="EV Circular — the battery problem worth solving and the opportunity it creates">
  <defs>
    <linearGradient id="probBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17181b"/>
      <stop offset="100%" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="oppBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2118"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <radialGradient id="oppGlow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ LEFT: THE PROBLEM ============ -->
  <rect x="0" y="0" width="600" height="800" fill="url(#probBg)"/>
  <!-- skyline silhouette -->
  <g fill="#08090b">
    <rect x="0" y="470" width="80" height="90"/>
    <rect x="90" y="440" width="55" height="120"/>
    <rect x="155" y="490" width="70" height="70"/>
    <rect x="300" y="455" width="60" height="105"/>
    <rect x="370" y="480" width="45" height="80"/>
    <rect x="425" y="440" width="70" height="120"/>
    <rect x="505" y="475" width="60" height="85"/>
  </g>
  <g fill="#f59e0b" opacity="0.35">
    <rect x="100" y="460" width="6" height="6"/><rect x="118" y="480" width="6" height="6"/><rect x="440" y="465" width="6" height="6"/><rect x="460" y="490" width="6" height="6"/><rect x="320" y="475" width="6" height="6"/>
  </g>
  <!-- smoke haze -->
  <g fill="#8a8f98" opacity="0.10">
    <ellipse cx="150" cy="430" rx="180" ry="40"/>
    <ellipse cx="420" cy="410" rx="220" ry="46"/>
  </g>
  <!-- battery graveyard -->
  <g transform="translate(60 560)">
    <g transform="rotate(-8 0 0)">
      <rect x="0" y="0" width="150" height="84" rx="10" fill="#20242a" stroke="#3a4048" stroke-width="2"/>
      <rect x="150" y="14" width="16" height="30" rx="4" fill="#3a4048"/>
      <rect x="14" y="14" width="80" height="10" rx="5" fill="#2c3138"/>
      <text x="20" y="58" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" fill="#ff6a4d">⚠ 12%</text>
    </g>
    <g transform="translate(210 30) rotate(5)">
      <rect x="0" y="0" width="180" height="96" rx="10" fill="#1b1f24" stroke="#333941" stroke-width="2"/>
      <rect x="180" y="18" width="18" height="34" rx="4" fill="#333941"/>
      <line x1="20" y1="30" x2="120" y2="30" stroke="#2c3138" stroke-width="8" stroke-linecap="round"/>
      <text x="20" y="72" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" fill="#ff6a4d">⚠ DEAD</text>
    </g>
    <g transform="translate(60 110) rotate(-3)">
      <rect x="0" y="0" width="200" height="100" rx="10" fill="#23272e" stroke="#3d434c" stroke-width="2"/>
      <rect x="200" y="20" width="18" height="36" rx="4" fill="#3d434c"/>
      <circle cx="40" cy="50" r="16" fill="none" stroke="#ff6a4d" stroke-width="3"/>
      <line x1="29" y1="39" x2="51" y2="61" stroke="#ff6a4d" stroke-width="3"/>
      <text x="70" y="58" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" fill="#9aa0ae">NO TRACE</text>
    </g>
    <g transform="translate(300 120) rotate(7)">
      <rect x="0" y="0" width="140" height="78" rx="10" fill="#1d2127" stroke="#333941" stroke-width="2"/>
      <text x="20" y="48" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" fill="#ff6a4d">⚠ LEAK</text>
    </g>
  </g>
  <!-- left copy -->
  <text x="70" y="110" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="6" fill="#ff6a4d">THE PROBLEM</text>
  <text x="70" y="165" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="43" font-weight="800" fill="#ffffff">India's EV future</text>
  <text x="70" y="215" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="43" font-weight="800" fill="#ffffff">faces <tspan fill="#9ca3af">a battery challenge.</tspan></text>
  <text x="70" y="262" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="16" fill="#b6bcc6">Millions of EV batteries will reach end-of-life in the</text>
  <text x="70" y="286" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="16" fill="#b6bcc6">coming years — but recycling, traceability and</text>
  <text x="70" y="310" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="16" fill="#b6bcc6">second-life systems are still limited.</text>
  <!-- problem chips -->
  <g font-family="Inter,'Segoe UI',system-ui,sans-serif">
    <g>
      <rect x="70" y="345" width="115" height="86" rx="10" fill="#141519" stroke="#26272d"/>
      <text x="84" y="378" font-size="16" fill="#ff6a4d">🗑</text>
      <text x="84" y="400" font-size="12.5" font-weight="700" fill="#e5e7eb">Growing</text>
      <text x="84" y="416" font-size="12.5" font-weight="700" fill="#e5e7eb">battery waste</text>
    </g>
    <g>
      <rect x="197" y="345" width="115" height="86" rx="10" fill="#141519" stroke="#26272d"/>
      <text x="211" y="378" font-size="16" fill="#9ca3af">▦</text>
      <text x="211" y="400" font-size="12.5" font-weight="700" fill="#e5e7eb">Limited</text>
      <text x="211" y="416" font-size="12.5" font-weight="700" fill="#e5e7eb">recycling</text>
    </g>
    <g>
      <rect x="324" y="345" width="115" height="86" rx="10" fill="#141519" stroke="#26272d"/>
      <text x="338" y="378" font-size="16" fill="#ff6a4d">⚠</text>
      <text x="338" y="400" font-size="12.5" font-weight="700" fill="#e5e7eb">Lack of</text>
      <text x="338" y="416" font-size="12.5" font-weight="700" fill="#e5e7eb">traceability</text>
    </g>
    <g>
      <rect x="451" y="345" width="115" height="86" rx="10" fill="#141519" stroke="#26272d"/>
      <text x="465" y="378" font-size="16" fill="#9ca3af">☁</text>
      <text x="465" y="400" font-size="12.5" font-weight="700" fill="#e5e7eb">Environmental</text>
      <text x="465" y="416" font-size="12.5" font-weight="700" fill="#e5e7eb">risks</text>
    </g>
  </g>

  <!-- ============ RIGHT: THE OPPORTUNITY ============ -->
  <rect x="600" y="0" width="600" height="800" fill="url(#oppBg)"/>
  <rect x="600" y="0" width="600" height="800" fill="url(#oppGlow)"/>
  <!-- sun + wind turbines -->
  <circle cx="1090" cy="180" r="46" fill="#fbbf24" opacity="0.85"/>
  <g stroke="#d8d4cc" stroke-width="4" stroke-linecap="round">
    <line x1="1010" y1="330" x2="1010" y2="240"/>
    <line x1="1010" y1="240" x2="1010" y2="196"/>
    <line x1="1010" y1="240" x2="974" y2="262"/>
    <line x1="1010" y1="240" x2="1046" y2="262"/>
  </g>
  <g stroke="#c9c5bd" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="1120" y1="300" x2="1120" y2="240"/>
    <line x1="1120" y1="240" x2="1120" y2="208"/>
    <line x1="1120" y1="240" x2="1094" y2="256"/>
    <line x1="1120" y1="240" x2="1146" y2="256"/>
  </g>
  <!-- skyline -->
  <g fill="#171310">
    <rect x="620" y="360" width="55" height="100"/>
    <rect x="690" y="330" width="45" height="130"/>
    <rect x="960" y="350" width="50" height="110"/>
    <rect x="1030" y="380" width="40" height="80"/>
  </g>
  <!-- circular flow ring -->
  <g transform="translate(900 560)">
    <circle r="150" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="26 14"/>
    <!-- center battery -->
    <g transform="translate(-60 -40)">
      <rect x="0" y="0" width="120" height="80" rx="10" fill="#242a30" stroke="#3d434c" stroke-width="2.5"/>
      <rect x="120" y="24" width="14" height="30" rx="4" fill="#3d434c"/>
      <rect x="14" y="14" width="60" height="12" rx="6" fill="#22c55e"/>
      <text x="14" y="58" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" fill="#4ade80">86%</text>
    </g>
    <!-- orbit nodes -->
    <g font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700">
      <g transform="translate(0 -150)">
        <rect x="-64" y="-20" width="128" height="40" rx="20" fill="#12291c" stroke="#1e4d33"/>
        <circle cx="-44" cy="0" r="5" fill="#4ade80"/><text x="-30" y="5" fill="#d1fae5">Collection</text>
      </g>
      <g transform="translate(150 0)">
        <rect x="-66" y="-20" width="132" height="40" rx="20" fill="#12291c" stroke="#1e4d33"/>
        <circle cx="-46" cy="0" r="5" fill="#4ade80"/><text x="-32" y="5" fill="#d1fae5">Diagnostics</text>
      </g>
      <g transform="translate(90 120)">
        <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#12291c" stroke="#1e4d33"/>
        <circle cx="-40" cy="0" r="5" fill="#4ade80"/><text x="-26" y="5" fill="#d1fae5">Second Life</text>
      </g>
      <g transform="translate(-90 120)">
        <rect x="-56" y="-20" width="112" height="40" rx="20" fill="#12291c" stroke="#1e4d33"/>
        <circle cx="-36" cy="0" r="5" fill="#4ade80"/><text x="-22" y="5" fill="#d1fae5">Recycling</text>
      </g>
      <g transform="translate(-180 0)">
        <rect x="-84" y="-20" width="168" height="40" rx="20" fill="#12291c" stroke="#1e4d33"/>
        <circle cx="-64" cy="0" r="5" fill="#4ade80"/><text x="-50" y="5" fill="#d1fae5">New Possibilities</text>
      </g>
    </g>
    <!-- flow arrows -->
    <g fill="#4ade80">
      <path d="M112 -92 L124 -80 L108 -78 Z"/>
      <path d="M92 118 L78 128 L74 112 Z"/>
      <path d="M-100 108 L-114 96 L-98 92 Z"/>
      <path d="M-118 -80 L-104 -92 L-98 -76 Z"/>
    </g>
  </g>
  <!-- right copy -->
  <text x="670" y="110" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="6" fill="#4ade80">THE OPPORTUNITY</text>
  <text x="670" y="165" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="40" font-weight="800" fill="#ffffff">A cleaner, more circular</text>
  <text x="670" y="213" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="40" font-weight="800" fill="#ffffff">EV ecosystem <tspan fill="#9ca3af">for India.</tspan></text>
  <text x="670" y="260" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="15.5" fill="#c9d1cb">Collection → diagnostics → reuse → recycling:</text>
  <text x="670" y="284" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="15.5" fill="#c9d1cb">recover materials, cut environmental impact,</text>
  <text x="670" y="308" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="15.5" fill="#c9d1cb">strengthen India's EV supply chain.</text>

  <!-- divider -->
  <line x1="600" y1="0" x2="600" y2="800" stroke="#000000" stroke-width="2"/>
  <circle cx="600" cy="400" r="34" fill="#0b0b0b" stroke="#ff7a17" stroke-width="2"/>
  <text x="600" y="410" text-anchor="middle" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#ff7a17">→</text>
</svg>
