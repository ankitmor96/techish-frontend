<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Techish Innovations — Skill-Based Social Network">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a17" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffb37a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7a17" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ring2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="chipbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1d1d"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.045">
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="900" x2="1200" y2="900"/>
    <line x1="0" y1="1200" x2="1200" y2="1200"/>
  </g>

  <!-- orbit rings -->
  <g transform="translate(600 700)">
    <circle r="420" fill="none" stroke="url(#ring2)" stroke-width="1.5"/>
    <circle r="330" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round"/>
    <circle r="235" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- nodes on outer ring -->
    <g>
      <circle cx="0" cy="-420" r="7" fill="#ff7a17"/>
      <circle cx="297" cy="-297" r="5" fill="#ffffff" fill-opacity="0.5"/>
      <circle cx="420" cy="0" r="7" fill="#ffffff" fill-opacity="0.75"/>
      <circle cx="297" cy="297" r="5" fill="#ff7a17" fill-opacity="0.7"/>
      <circle cx="0" cy="420" r="5" fill="#ffffff" fill-opacity="0.5"/>
      <circle cx="-297" cy="297" r="7" fill="#ffffff" fill-opacity="0.4"/>
      <circle cx="-420" cy="0" r="5" fill="#ff7a17" fill-opacity="0.5"/>
      <circle cx="-297" cy="-297" r="7" fill="#ffffff" fill-opacity="0.6"/>
    </g>
    <!-- nodes on middle ring -->
    <circle cx="233" cy="-233" r="5" fill="#ffffff" fill-opacity="0.35"/>
    <circle cx="-233" cy="233" r="5" fill="#ffffff" fill-opacity="0.35"/>
    <circle cx="166" cy="166" r="4" fill="#ff7a17" fill-opacity="0.55"/>
    <circle cx="-166" cy="-166" r="4" fill="#ffffff" fill-opacity="0.4"/>

    <!-- network connection lines -->
    <g stroke="#ff7a17" stroke-opacity="0.25" stroke-width="1.5">
      <line x1="0" y1="-420" x2="233" y2="-233"/>
      <line x1="233" y1="-233" x2="420" y2="0"/>
      <line x1="420" y1="0" x2="166" y2="166"/>
      <line x1="166" y1="166" x2="0" y2="420"/>
      <line x1="0" y1="420" x2="-233" y2="233"/>
      <line x1="-233" y1="233" x2="-420" y2="0"/>
      <line x1="-420" y1="0" x2="-166" y2="-166"/>
      <line x1="-166" y1="-166" x2="0" y2="-420"/>
    </g>

    <!-- center monogram -->
    <circle r="118" fill="#101010" stroke="#2a2a2a" stroke-width="1.5"/>
    <circle r="118" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.8"/>
    <text x="0" y="18" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="86" font-weight="700" fill="#ff7a17">S</text>
    <text x="0" y="64" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="6" fill="#9ca3af">SKILLS</text>
  </g>

  <!-- floating skill chips -->
  <g font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">
    <g transform="translate(150 480)">
      <rect x="0" y="0" width="230" height="56" rx="28" fill="url(#chipbg)" stroke="#2c2c2c"/>
      <circle cx="30" cy="28" r="6" fill="#ff7a17"/>
      <text x="52" y="35" font-size="19" letter-spacing="2" fill="#e5e7eb">PYTHON</text>
    </g>
    <g transform="translate(820 430)">
      <rect x="0" y="0" width="230" height="56" rx="28" fill="url(#chipbg)" stroke="#2c2c2c"/>
      <circle cx="30" cy="28" r="6" fill="#ffffff" fill-opacity="0.85"/>
      <text x="52" y="35" font-size="19" letter-spacing="2" fill="#e5e7eb">REACT</text>
    </g>
    <g transform="translate(110 940)">
      <rect x="0" y="0" width="230" height="56" rx="28" fill="url(#chipbg)" stroke="#2c2c2c"/>
      <circle cx="30" cy="28" r="6" fill="#ffffff" fill-opacity="0.85"/>
      <text x="52" y="35" font-size="19" letter-spacing="2" fill="#e5e7eb">SYSTEM DESIGN</text>
    </g>
    <g transform="translate(830 1000)">
      <rect x="0" y="0" width="250" height="56" rx="28" fill="url(#chipbg)" stroke="#2c2c2c"/>
      <circle cx="30" cy="28" r="6" fill="#ff7a17"/>
      <text x="52" y="35" font-size="19" letter-spacing="2" fill="#e5e7eb">NODE.JS</text>
    </g>
    <g transform="translate(430 1180)">
      <rect x="0" y="0" width="280" height="56" rx="28" fill="url(#chipbg)" stroke="#2c2c2c"/>
      <circle cx="30" cy="28" r="6" fill="#ff7a17" fill-opacity="0.85"/>
      <text x="52" y="35" font-size="19" letter-spacing="2" fill="#e5e7eb">OPPORTUNITY</text>
    </g>
  </g>

  <!-- footer brand strip -->
  <g transform="translate(0 1360)">
    <rect x="0" y="0" width="1200" height="140" fill="#0b0b0b"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#222222" stroke-width="1"/>
    <text x="70" y="86" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="30" font-weight="700" letter-spacing="10" fill="#ffffff">TECHISH<tspan fill="#ff7a17">.</tspan></text>
    <text x="1130" y="86" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="18" letter-spacing="5" fill="#6b7280">SKILL-BASED NETWORKS</text>
  </g>
</svg>
