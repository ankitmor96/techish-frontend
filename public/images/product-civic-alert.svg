<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Civic Alert — civic incident map">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#16181a"/>
      <stop offset="55%" stop-color="#101113"/>
      <stop offset="100%" stop-color="#0b0c0d"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bgC)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="0" y1="1125" x2="1200" y2="1125"/>
  </g>
  <text x="1120" y="150" text-anchor="end" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="120" font-weight="700" fill="#15151a">02</text>
  <text x="70" y="92" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="19" letter-spacing="5" fill="#6b7280">TECHISH INNOVATIONS — PRODUCT 02</text>

  <!-- tablet frame -->
  <rect x="60" y="150" width="1080" height="760" rx="24" fill="#060607" stroke="#26262b" stroke-width="2"/>
  <rect x="74" y="164" width="1052" height="732" rx="12" fill="#f4f2ee"/>

  <!-- sidebar (dark) -->
  <rect x="74" y="164" width="310" height="732" fill="#ffffff"/>
  <line x1="384" y1="164" x2="384" y2="896" stroke="#e5e1da"/>
  <text x="98" y="212" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#2b3440">SEARCH</text>
  <rect x="98" y="228" width="130" height="46" rx="10" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <circle cx="118" cy="251" r="6" fill="none" stroke="#8a8f98" stroke-width="1.6"/>
  <line x1="122" y1="255" x2="128" y2="261" stroke="#8a8f98" stroke-width="1.6"/>
  <text x="138" y="257" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" fill="#9aa0a6">Search</text>
  <rect x="242" y="228" width="120" height="46" rx="10" fill="#2f7dbf"/>
  <text x="302" y="257" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Search</text>

  <text x="98" y="322" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#2b3440">QUICK ACTIONS</text>
  <g font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13.5" fill="#2b3440">
    <rect x="98" y="340" width="122" height="52" rx="10" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
    <circle cx="118" cy="360" r="7" fill="none" stroke="#2b3440" stroke-width="1.5"/><circle cx="118" cy="360" r="2.5" fill="#2b3440"/>
    <text x="134" y="364">Use My</text><text x="134" y="380">Location</text>
    <rect x="232" y="340" width="120" height="52" rx="10" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
    <rect x="248" y="352" width="16" height="16" fill="none" stroke="#2b3440" stroke-width="1.5"/>
    <text x="272" y="364">Draw Area</text>
    <rect x="98" y="404" width="122" height="52" rx="10" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
    <path d="M112 436 L122 424 L128 432 L138 420" fill="none" stroke="#2b3440" stroke-width="1.8"/>
    <text x="134" y="434">Draw Line</text>
    <rect x="232" y="404" width="120" height="52" rx="10" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
    <g stroke="#c0392b" stroke-width="1.8"><line x1="250" y1="418" x2="262" y2="430"/><line x1="262" y1="418" x2="250" y2="430"/></g>
    <text x="272" y="434">Clear Drawing</text>
  </g>
  <text x="98" y="492" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#5d6570">Affected line drawn on the map — use Clear Drawing to remove it.</text>

  <text x="98" y="548" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#2b3440">SELECTED LOCATION</text>
  <rect x="98" y="564" width="264" height="52" rx="10" fill="#eaf3fb" stroke="#bcd9f0"/>
  <circle cx="120" cy="590" r="7" fill="none" stroke="#2f7dbf" stroke-width="1.8"/><circle cx="120" cy="590" r="2.5" fill="#2f7dbf"/>
  <text x="138" y="596" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#22303c">72.12298, 21.76300</text>

  <text x="98" y="656" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#2b3440">NEAREST ROAD</text>
  <rect x="98" y="672" width="264" height="52" rx="10" fill="#f6f4f0" stroke="#e2ded6"/>
  <text x="116" y="704" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" fill="#8a8f98">No nearby road found in the current view.</text>

  <!-- alert card (dark, on map edge) -->
  <rect x="880" y="200" width="230" height="180" rx="14" fill="#141419" stroke="#2a2a31"/>
  <text x="902" y="232" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Road Closure</text>
  <text x="902" y="254" font-family="Inter,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#8b8fa3">RING ROAD · BHAVNAGAR</text>
  <rect x="902" y="268" width="96" height="24" rx="6" fill="#3a1a12" stroke="#7f3a20"/>
  <text x="950" y="285" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#ff7a4d">Road Closed</text>
  <text x="902" y="316" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" fill="#9ca3af">Until 5:00 PM</text>
  <circle cx="1052" cy="296" r="26" fill="none" stroke="#ff5a3c" stroke-opacity="0.35" stroke-width="10"/>
  <path d="M1046 286 L1058 286 L1052 302 Z" fill="#ff5a3c"/>
  <g font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5">
    <circle cx="908" cy="338" r="3" fill="#ff5a3c"/><text x="918" y="342" fill="#d1d5db">2.8 km affected</text>
    <circle cx="908" cy="356" r="3" fill="#ff5a3c"/><text x="918" y="360" fill="#d1d5db">Nearby residents notified</text>
  </g>

  <!-- ROAD CLOSED sign on map -->
  <g transform="translate(660 780)">
    <rect x="0" y="0" width="210" height="64" rx="8" fill="#1a1a1e" stroke="#000000"/>
    <text x="105" y="27" text-anchor="middle" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#ff7a4d">ROAD CLOSED</text>
    <text x="105" y="47" text-anchor="middle" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#ffb08a">AHEAD</text>
  </g>

  <!-- MAP (right side) -->
  <g>
    <rect x="384" y="164" width="742" height="732" fill="#eef0e9"/>
    <!-- park + water -->
    <path d="M900 780 L1010 760 L1080 820 L1060 896 L940 896 L880 840 Z" fill="#cfe6c4" opacity="0.9"/>
    <ellipse cx="820" cy="800" rx="150" ry="90" fill="#aecdf0"/>
    <ellipse cx="760" cy="880" rx="90" ry="40" fill="#aecdf0"/>
    <!-- minor road grid -->
    <g stroke="#d3d0c8" stroke-width="2" fill="none">
      <path d="M400 200 L420 896 M470 180 L480 896 M540 170 L550 896 M610 165 L618 896 M680 170 L690 896 M760 175 L770 896 M840 180 L850 896 M920 185 L930 896"/>
      <path d="M384 250 L1126 240 M384 320 L1126 310 M384 400 L1126 390 M384 480 L1126 470 M384 560 L1126 550 M384 640 L1126 630 M384 720 L1126 710"/>
    </g>
    <!-- major roads -->
    <g stroke="#f6c35c" stroke-width="6" fill="none">
      <path d="M384 440 C560 430 720 420 1126 400"/>
      <path d="M384 660 C560 655 760 650 1126 640"/>
    </g>
    <g stroke="#7f96c4" stroke-width="5" fill="none">
      <path d="M640 164 C650 400 660 600 680 896"/>
      <path d="M980 164 C985 400 995 600 1010 896"/>
    </g>
    <!-- affected road (red dashes) -->
    <g stroke="#e04a3a" stroke-width="7" fill="none">
      <path d="M856 164 C850 320 830 480 810 660" stroke-dasharray="18 12"/>
    </g>
    <!-- incident marker -->
    <circle cx="852" cy="420" r="14" fill="#e04a3a"/>
    <circle cx="852" cy="420" r="22" fill="none" stroke="#e04a3a" stroke-opacity="0.35" stroke-width="5"/>
    <!-- road labels -->
    <g font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" fill="#8a8f98">
      <text x="440" y="500" transform="rotate(-3 440 500)">Nari Chowkdi to Rto Circle Road</text>
      <text x="700" y="600" transform="rotate(-1 700 600)">Victoria Park Road</text>
      <text x="866" y="260" transform="rotate(88 866 260)">WTO Lawis Road</text>
      <text x="990" y="700" transform="rotate(-2 990 700)">Shelandshan Rd</text>
    </g>
    <g font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10" fill="#9aa0a6">
      <rect x="556" y="330" width="44" height="20" rx="4" fill="#ffffff" stroke="#d8d4cc"/><text x="578" y="344" text-anchor="middle">SH-25</text>
    </g>
    <!-- zoom controls -->
    <rect x="1066" y="740" width="40" height="76" rx="10" fill="#ffffff" stroke="#d8d4cc"/>
    <text x="1086" y="772" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="22" fill="#5d6570">+</text>
    <text x="1086" y="802" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="22" fill="#5d6570">−</text>
  </g>

  <!-- caption + watermark -->
  <text x="600" y="1010" text-anchor="middle" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="4" fill="#6b7280">REAL-TIME INCIDENT &amp; ROAD ALERTS FOR CONNECTED CITIES</text>
  <text x="600" y="1190" text-anchor="middle" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="58" letter-spacing="12" fill="#111214">CIVIC ALERT</text>

  <!-- brand strip -->
  <rect x="0" y="1360" width="1200" height="140" fill="#0b0b0b"/>
  <line x1="0" y1="1360" x2="1200" y2="1360" stroke="#222222"/>
  <text x="70" y="1446" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="30" font-weight="700" letter-spacing="10" fill="#ffffff">TECHISH<tspan fill="#ff7a17">.</tspan></text>
  <text x="1130" y="1446" text-anchor="end" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="18" letter-spacing="5" fill="#6b7280">CIVIC ALERT</text>
</svg>
